services:
  web:
    build: .
    ports:
      - "8000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db

  db:
    image: postgres:18
    restart: always
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - books-data:/var/lib/postgresql

    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: bookspass
      POSTGRES_DB: booksdb

volumes:
  books-data: